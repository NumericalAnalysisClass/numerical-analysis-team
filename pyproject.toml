[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numerical-analysis-team"
version = "0.0.2"
description = "Textbook numerical analysis methods for a university course, with iteration histories for study"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "testjikuji" }]
keywords = ["numerical analysis", "education", "root finding"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "scipy"]

[tool.hatch.build.targets.wheel]
packages = ["src/numerical_analysis_team"]

[tool.hatch.build.targets.sdist]
include = ["src/numerical_analysis_team", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
